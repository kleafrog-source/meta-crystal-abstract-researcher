version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mmss-crystal-db
    environment:
      POSTGRES_USER: mind_user
      POSTGRES_PASSWORD: mindfreak
      POSTGRES_DB: mmss-crystal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mind_user -d mmss-crystal"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
