<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AM-Core Logo Button — Final</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #06080f;
      font-family: system-ui, sans-serif;
    }

    .logo-btn {
      width: 128px;
      height: 128px;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      border-radius: 50%;
      position: relative;
      outline: none;
    }

    .logo-btn:focus-visible {
      box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.5);
    }

    .logo-btn svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    #rotatingGroup {
      transition: transform 0.7s cubic-bezier(0.34, 1.4, 0.64, 1);
      transform-origin: 32px 32px;
    }

    /* ——— Серое состояние ——— */
    .ring-outer { stroke: #4B5563; transition: stroke 0.35s ease; }

    .big-1 { stroke: #F3F4F6; transition: stroke 0.4s ease; }       /* центральный */
    .big-2 { stroke: #6B7280; transition: stroke 0.4s ease; }       /* верхний → будет оранжевый */
    .big-3 { stroke: #D1D5DB; transition: stroke 0.4s ease; }       /* нижний */
    .big-4 { stroke: #9CA3AF; transition: stroke 0.4s ease; }       /* фиолетовый */
    .big-5 { stroke: #4B5563; transition: stroke 0.4s ease; }
    .big-6 { stroke: #E5E7EB; transition: stroke 0.4s ease; }       /* розовый */
    .big-7 { stroke: #6B7280; transition: stroke 0.4s ease; }

    .center-fill { fill: #F9FAFB; transition: fill 0.4s ease; }

    /* ——— Цветное состояние ——— */
    .logo-btn.is-colored .ring-outer { stroke: #4B5563; }

    .logo-btn.is-colored .big-1 { stroke: #E0E7FF; }
    .logo-btn.is-colored .big-2 { stroke: #F59E0B; }     /* оранжевый вместо зелёного */
    .logo-btn.is-colored .big-3 { stroke: #38BDF8; }
    .logo-btn.is-colored .big-4 { stroke: #C084FC; }
    .logo-btn.is-colored .big-5 { stroke: #818CF8; }
    .logo-btn.is-colored .big-6 { stroke: #E879F9; }
    .logo-btn.is-colored .big-7 { stroke: #A5B4FC; }

    .logo-btn.is-colored .center-fill { fill: #FFFFFF; }

    /* Пошаговое появление (~2.5s) */
    .logo-btn.animating .big-1 { transition-delay: 0.00s; }
    .logo-btn.animating .big-2 { transition-delay: 0.22s; }
    .logo-btn.animating .big-3 { transition-delay: 0.44s; }
    .logo-btn.animating .big-4 { transition-delay: 0.66s; }
    .logo-btn.animating .big-5 { transition-delay: 0.88s; }
    .logo-btn.animating .big-6 { transition-delay: 1.10s; }
    .logo-btn.animating .big-7 { transition-delay: 1.32s; }
    .logo-btn.animating .center-fill { transition-delay: 1.70s; }

    /* Пауза */
    .logo-btn.paused .big-1,
    .logo-btn.paused .big-2,
    .logo-btn.paused .big-3,
    .logo-btn.paused .big-4,
    .logo-btn.paused .big-5,
    .logo-btn.paused .big-6,
    .logo-btn.paused .big-7,
    .logo-btn.paused .center-fill {
      transition: none !important;
    }
  </style>
</head>
<body>

  <button class="logo-btn" id="logoBtn" aria-label="AM-Core Logo">
    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Фон только внутри -->
      <circle cx="32" cy="32" r="30" fill="#0B0F1A"/>
      <circle class="ring-outer" cx="32" cy="32" r="30" stroke-width="1.15" opacity="0.6"/>

      <g id="rotatingGroup">
        <!-- Большие круги -->
        <circle class="big-1" cx="32" cy="32"  r="13.1" stroke-width="1.25"/>  <!-- тоньше -->
        <circle class="big-2" cx="32" cy="20.4" r="13.1" stroke-width="0.95"/>
        <circle class="big-3" cx="32" cy="43.6" r="13.1" stroke-width="1.35"/>
        <circle class="big-4" cx="21.9" cy="26.2" r="13.1" stroke-width="0.95"/> <!-- фиолетовый тоньше -->
        <circle class="big-5" cx="42.1" cy="26.2" r="13.1" stroke-width="0.85"/>
        <circle class="big-6" cx="21.9" cy="37.8" r="13.1" stroke-width="1.50"/>
        <circle class="big-7" cx="42.1" cy="37.8" r="13.1" stroke-width="1.05"/>

        <!-- Центральный белый круг (заливка, на переднем плане) -->
        <circle class="center-fill" cx="32" cy="32" r="6.55"/>
      </g>
    </svg>
  </button>

  <script>
    const btn = document.getElementById('logoBtn');
    const rotatingGroup = document.getElementById('rotatingGroup');

    let currentRotation = 23.44;
    let fadeTimeout = null;
    let isHovering = false;

    rotatingGroup.style.transform = `rotate(${currentRotation}deg)`;

    function startColorAnimation() {
      btn.classList.remove('paused');
      btn.classList.add('animating', 'is-colored');
    }

    function pauseColorAnimation() {
      btn.classList.add('paused');
      btn.classList.remove('animating');
    }

    function fadeToGray() {
      btn.classList.remove('paused', 'animating', 'is-colored');
    }

    function resetIdleTimer() {
      clearTimeout(fadeTimeout);
      fadeTimeout = setTimeout(() => {
        if (!isHovering) fadeToGray();
      }, 4000);
    }

    btn.addEventListener('mouseenter', () => {
      isHovering = true;
      clearTimeout(fadeTimeout);
      startColorAnimation();
    });

    btn.addEventListener('mouseleave', () => {
      isHovering = false;
      pauseColorAnimation();
      resetIdleTimer();
    });

    btn.addEventListener('click', () => {
      currentRotation += 36;
      rotatingGroup.style.transform = `rotate(${currentRotation}deg)`;
      resetIdleTimer();
    });

    btn.addEventListener('pointerdown', resetIdleTimer);
  </script>
</body>
</html>
